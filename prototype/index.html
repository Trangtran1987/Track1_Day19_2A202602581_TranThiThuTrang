<title>AI Notes A/B/C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: một cột hẹp như app ghi chú trên điện thoại; khung nhiệm vụ cố định ở đầu mỗi bản, thanh "Tôi đã xong" ở đáy */
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --ink:#1A2232; --muted:#586276; --line:#DADFE8;
  --accent:#2C56CC; --accent-soft:#E5EBFB; --on-accent:#FFFFFF;
  --ai:#0A6E6C; --ai-soft:#DFF1F0;
  --warn:#8F5000; --warn-soft:#FFF0D6;
  --ok:#1B6E44; --ok-soft:#E0F2E7;
  --font-ui:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151D; --surface:#1A202B; --ink:#E6EAF2; --muted:#9AA4B7; --line:#2C3443;
    --accent:#7F9FFF; --accent-soft:#222E4F; --on-accent:#0D1220;
    --ai:#5CCBC6; --ai-soft:#15302F;
    --warn:#F2B35C; --warn-soft:#352813;
    --ok:#6CD39C; --ok-soft:#163223;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151D; --surface:#1A202B; --ink:#E6EAF2; --muted:#9AA4B7; --line:#2C3443;
  --accent:#7F9FFF; --accent-soft:#222E4F; --on-accent:#0D1220;
  --ai:#5CCBC6; --ai-soft:#15302F;
  --warn:#F2B35C; --warn-soft:#352813;
  --ok:#6CD39C; --ok-soft:#163223;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 112px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:.78rem}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.appbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.appname{font-weight:700;font-size:1.05rem}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}

.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ai-box{background:var(--ai-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ai-box .ai-tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ai)}
.warn-box{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.88rem}

.note{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note .t{min-width:0;overflow-wrap:anywhere}
.ntype{font-family:var(--font-mono);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.time{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);margin-top:2px}
.note-actions{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.slide{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:4px}
.slide .mono{color:var(--muted)}

button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.9rem;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:4px 9px;font-size:.8rem}
.btn.link{border:0;background:none;padding:2px 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select,input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;max-width:100%}
.title-input{width:100%;font-weight:600}
.group-head{display:flex;gap:8px;align-items:center}
.group-head input{flex:1;min-width:0}
.unsure{font-size:.78rem;color:var(--warn);font-weight:500}

.progress{font-family:var(--font-mono);font-size:.82rem;color:var(--muted)}
.status{font-size:.78rem;font-weight:600}

.facbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px))}
.facbar .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.radio-row{display:flex;flex-direction:column;gap:6px}
.radio-row label{display:flex;gap:8px;align-items:center;cursor:pointer}
.log{width:100%;min-height:220px;font-family:var(--font-mono);font-size:.78rem;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper);color:var(--ink);resize:vertical}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);white-space:nowrap}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.toast{font-size:.85rem;color:var(--ok)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>
<div class="facbar" id="facbar" hidden></div>

<script>
/* ---------- Dữ liệu chung (synthetic data do nhóm tạo) ---------- */
const NOTES = {
  n1:{type:'img', slide:6, text:'Ảnh chụp slide 6 · Long-running', time:'14:05'},
  n2:{type:'img', slide:9, text:'Ảnh chụp slide 9 · Ví dụ chi phí', time:'14:21'},
  n3:{type:'text', text:'timeout 60s của gateway?? sao lại cắt', time:'14:06'},
  n4:{type:'text', text:'stateful = phải nhớ hội thoại, nhưng lưu ở đâu?', time:'14:12'},
  n5:{type:'text', text:'costly — về tìm hiểu thêm', time:'14:19'},
  n6:{type:'q', text:'Tại sao không lưu lịch sử ngay trên trình duyệt?', time:'14:14'}
};
const TYPE_LABEL = {img:'Ảnh', text:'Ghi', q:'Hỏi'};
const RAW_ORDER = ['n3','n1','n5','n4','n2','n6'];
const SLIDES = {
  6:{title:'Long-running', body:'Một lượt chạy Agent có thể kéo dài nhiều phút vì phải gọi nhiều công cụ liên tiếp. Gateway/proxy thường tự cắt kết nối sau 30–60 giây không có phản hồi → cần chạy Agent như tác vụ nền và trả kết quả sau.'},
  7:{title:'Stateful', body:'Web App thông thường xử lý mỗi request độc lập (stateless). Agent cần nhớ lịch sử hội thoại và kết quả các bước trước → cần nơi lưu session như database hoặc cache.'},
  8:{title:'Costly', body:'Mỗi lần gọi mô hình được tính tiền theo số token gửi đi và nhận về. Một nhiệm vụ của Agent thường gọi mô hình nhiều lần.'},
  9:{title:'Ví dụ chi phí', body:'Lượt 1 gửi khoảng 1.000 token. Đến lượt 10, Agent gửi lại toàn bộ lịch sử: khoảng 10.000 token cho một lượt. Hội thoại càng dài, mỗi lượt càng đắt.'}
};
const POINTS = {
  p1:{n:'①', title:'Vì sao Agent chạy lâu bị gateway/proxy cắt kết nối', notes:['n1','n3'], slides:[6]},
  p2:{n:'②', title:'Vì sao Agent phải lưu trạng thái và lịch sử hội thoại', notes:['n4','n6'], slides:[7]},
  p3:{n:'③', title:'Vì sao gửi lại lịch sử hội thoại làm tăng token và chi phí', notes:['n2','n5'], slides:[8,9]}
};
const TASK = 'Ngày mai bạn học buổi 13. Hãy xử lý những điểm bạn đã ghi là chưa hiểu từ buổi 12.';
const ORDERS = {abc:['A','B','C'], bca:['B','C','A'], cab:['C','A','B']};
const OPT_NAME = {A:'A · AI sắp xếp, người duyệt', B:'B · AI nhắc ôn, người chọn', C:'C · Người tự đánh dấu, AI hỗ trợ khi hỏi'};

/* ---------- Câu trả lời AI viết sẵn (canned output) ---------- */
const C_ANSWERS = {
  p1:{grounded:true, cite:'Theo slide 6', text:'Một lượt chạy Agent có thể kéo dài nhiều phút vì phải gọi nhiều công cụ liên tiếp. Gateway hoặc proxy đứng giữa thường tự cắt kết nối nếu sau 30–60 giây chưa có phản hồi. Vì vậy Agent chạy lâu nên chạy nền và báo kết quả sau, thay vì giữ kết nối chờ.',
      alt:'Hình dung bạn gọi tổng đài và tổng đài tự cúp máy sau một phút im lặng. Nếu câu trả lời cần năm phút, cách hợp lý là để tổng đài gọi lại cho bạn khi xong.'},
  p2:{grounded:true, cite:'Theo slide 7', text:'Web App thông thường xử lý mỗi yêu cầu độc lập, không cần nhớ yêu cầu trước. Agent thì cần nhớ lịch sử hội thoại và kết quả các bước trước để làm tiếp. Do đó cần một nơi lưu phiên làm việc (session) như database hoặc cache.',
      alt:'Giống nói chuyện với một người hay quên: nếu sau mỗi câu họ quên sạch, bạn phải kể lại từ đầu. Session là "trí nhớ" giúp Agent khỏi phải bắt đầu lại.'},
  /* Lỗi cài sẵn: trả lời ngoài slide, nội dung sai trọng tâm (slide 9 mới đúng) */
  p3:{grounded:false, cite:null, text:'Chi phí của Agent tăng chủ yếu vì Agent chạy lâu, giữ máy chủ hoạt động nhiều phút cho mỗi yêu cầu. Lịch sử hội thoại dài làm máy chủ xử lý chậm hơn nên tốn tiền hơn.',
      alt:'Giống như thuê máy theo giờ: Agent chạy càng lâu thì càng tốn tiền thuê máy.'}
};
const B_SUGGEST = [
  {p:'p2', level:'high', reason:'Buổi 13 có phần “Lưu session cho Agent”. Bạn đã đánh dấu chưa hiểu vì sao Agent phải lưu lịch sử hội thoại.'},
  {p:'p3', level:'maybe', reason:'Buổi 13 có thể nhắc lại chi phí khi hội thoại dài. AI chưa chắc phần này có trong buổi 13.'}
  /* Lỗi cài sẵn: bỏ sót p1 dù đề cương buổi 13 có mục "Chạy Agent dưới dạng tác vụ nền" */
];
const B_OUTLINE = ['Chạy Agent dưới dạng tác vụ nền', 'Lưu session cho Agent', 'Theo dõi và giới hạn chi phí'];

/* ---------- Trạng thái ---------- */
let S = {screen:'start', order:'abc', tester:'', idx:0, log:[], t0:Date.now(), single:null, A:null, B:null, C:null, copied:false};
const freshA = () => ({stage:1, groups:[
    {id:'g1', title:'Agent chạy lâu bị ngắt kết nối', notes:['n1','n3','n2']},
    {id:'g2', title:'Agent phải lưu lịch sử hội thoại', notes:['n4','n6']},
    {id:'g3', title:'Chi phí token', notes:['n5']},
    {id:'g0', title:'Chưa phân loại', notes:[]}],
  unsure:{n6:true}, hist:[], raw:false, slide:{}, done:{}, open:{}});
const freshB = () => ({stage:1, remind:null, dec:{}, all:false, rev:null, res:{}, wrong:{}});
const freshC = () => ({items:[
    {id:'i1', p:'p1', text:'Sao Agent chạy lâu lại bị gateway cắt?'},
    {id:'i2', p:'p2', text:'Stateful là gì, lưu lịch sử ở đâu?'},
    {id:'i3', p:'p3', text:'Tại sao gửi lại lịch sử lại tốn token?'}],
  st:{}, open:null, asked:{}, alt:{}, flag:{}, slide:{}, nextId:4});

const cur = () => S.single || ORDERS[S.order][S.idx];
const secs = () => Math.round((Date.now() - S.t0) / 1000);
function log(ev){ S.log.push({opt:cur(), t:secs(), ev}); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function startOption(){ const o = cur(); S[o] = o==='A'?freshA():o==='B'?freshB():freshC(); S.t0 = Date.now(); S.screen = 'opt'; log('Bắt đầu'); }

/* ---------- Thành phần dùng chung ---------- */
const appbar = () => `<div class="appbar"><span class="appname">Sổ ghi chú học tập</span><span class="chip plain">Cloud · Buổi 12</span></div>`;
const taskBox = () => `<div class="task"><span class="label">Nhiệm vụ</span><p>${TASK}</p></div>`;
function noteRow(id, extra=''){
  const n = NOTES[id];
  return `<div class="note"><span class="ntype">${TYPE_LABEL[n.type]}</span><span class="t">${esc(n.text)}</span><span class="time">${n.time}</span>${extra}</div>`;
}
function slideBox(no){ const s = SLIDES[no]; return `<div class="slide"><span class="mono">Slide ${no} · ${s.title}</span><p>${s.body}</p></div>`; }

/* ---------- Option A: AI sắp xếp, người duyệt ---------- */
function viewA(){
  const a = S.A;
  if(a.stage===1){
    return `<div class="card"><div class="between"><h2>Ghi chú buổi 12</h2><span class="muted small">6 ghi chú</span></div>
      <div>${RAW_ORDER.map(id=>noteRow(id)).join('')}</div>
      <div class="row"><button class="btn primary" data-act="a-sort">Sắp xếp giúp tôi</button></div></div>`;
  }
  if(a.stage===2){
    if(a.raw){
      return `<div class="card"><div class="between"><h2>Ghi chú gốc</h2><button class="btn small" data-act="a-raw">Xem lại bản AI sắp xếp</button></div>
        <p class="muted small">Đây là toàn bộ ghi chú gốc, chưa qua AI.</p>
        <div>${RAW_ORDER.map(id=>noteRow(id)).join('')}</div></div>`;
    }
    const opts = g => a.groups.map(x=>`<option value="${x.id}"${x.id===g?' selected':''}>${esc(x.title)}</option>`).join('');
    const groups = a.groups.map(g => `
      <div class="card">
        <div class="group-head">${g.id==='g0' ? `<h3>Chưa phân loại</h3>` : `<input class="title-input" type="text" id="a-title-${g.id}" data-change="a-rename" data-arg="${g.id}" value="${esc(g.title)}" aria-label="Tên nhóm">`}<span class="muted small">${g.notes.length}</span></div>
        <div>${g.notes.length ? g.notes.map(id => noteRow(id, `<div class="note-actions">
            <span class="label">Từ ghi chú gốc</span>
            ${a.unsure[id] ? `<span class="unsure">AI không chắc — kiểm tra lại</span>` : ''}
            <select id="a-move-${id}" data-change="a-move" data-arg="${id}" aria-label="Chuyển sang nhóm">${opts(g.id)}</select>
            ${NOTES[id].slide ? `<button class="btn small" data-act="a-slide" data-arg="${id}">${a.slide[id]?'Ẩn ảnh':'Xem ảnh'}</button>` : ''}
            <button class="btn small" data-act="a-del" data-arg="${id}">Xóa khỏi danh sách</button>
          </div>${a.slide[id] ? `<div class="note-actions">${slideBox(NOTES[id].slide)}</div>` : ''}`)).join('') : `<p class="muted small">Không có ghi chú nào.</p>`}</div>
      </div>`).join('');
    return `<div class="ai-box"><span class="ai-tag">AI đã sắp xếp</span>
        <p>AI đã sắp xếp 6 ghi chú của bạn thành 3 điểm chưa hiểu. AI có thể xếp nhầm nhóm hoặc bỏ sót — hãy kiểm tra trước khi lưu.</p>
        <p class="small muted">AI không sửa hay xóa ghi chú gốc của bạn.</p></div>
      ${groups}
      <div class="row">
        <button class="btn primary" data-act="a-confirm">Xác nhận và lưu</button>
        <button class="btn" data-act="a-undo"${a.hist.length?'':' disabled'}>Hoàn tác</button>
        <button class="btn" data-act="a-raw">Bỏ qua sắp xếp của AI</button>
      </div>`;
  }
  const gs = a.groups.filter(g => g.notes.length);
  const done = gs.filter(g => a.done[g.id]).length;
  return `<div class="between"><h2>Điểm chưa hiểu đã lưu</h2><span class="progress">${done}/${gs.length} đã hiểu</span></div>
    ${gs.map(g => `<div class="card">
      <div class="between"><h3>${esc(g.title)}</h3>${a.done[g.id]?'<span class="chip ok">Đã hiểu</span>':'<span class="chip warn">Chưa hiểu</span>'}</div>
      <div class="row"><button class="btn small" data-act="a-open" data-arg="${g.id}">${a.open[g.id]?'Thu gọn':'Xem lại ghi chú gốc'}</button>
        <button class="btn small${a.done[g.id]?' on':''}" data-act="a-done" data-arg="${g.id}">${a.done[g.id]?'Bỏ đánh dấu':'Đánh dấu đã hiểu'}</button></div>
      ${a.open[g.id] ? `<div>${g.notes.map(id=>noteRow(id)).join('')}</div>${g.notes.filter(id=>NOTES[id].slide).map(id=>slideBox(NOTES[id].slide)).join('')}` : ''}
    </div>`).join('')}`;
}
function snapA(){ S.A.hist.push(JSON.stringify(S.A.groups)); }
const ACT_A = {
  'a-sort'(){ S.A.stage=2; log('Bấm "Sắp xếp giúp tôi"'); },
  'a-raw'(){ S.A.raw=!S.A.raw; log(S.A.raw?'Bỏ qua sắp xếp của AI (xem ghi chú gốc)':'Quay lại bản AI sắp xếp'); },
  'a-slide'(id){ S.A.slide[id]=!S.A.slide[id]; if(S.A.slide[id]) log(`Xem ảnh slide ${NOTES[id].slide}`); },
  'a-del'(id){ snapA(); S.A.groups.forEach(g=>g.notes=g.notes.filter(x=>x!==id)); log(`Xóa ghi chú "${NOTES[id].text}" khỏi danh sách`); },
  'a-undo'(){ const h=S.A.hist.pop(); if(h){ S.A.groups=JSON.parse(h); log('Hoàn tác'); } },
  'a-confirm'(){
    const g3 = S.A.groups.find(g=>g.id==='g3');
    log(g3.notes.includes('n2') ? 'Xác nhận — ĐÃ sửa lỗi AI (slide 9 chuyển về nhóm chi phí)' : 'Xác nhận — CHƯA sửa lỗi AI (slide 9 vẫn sai nhóm)');
    S.A.stage=3; },
  'a-open'(g){ S.A.open[g]=!S.A.open[g]; if(S.A.open[g]) log(`Mở lại ghi chú nhóm "${S.A.groups.find(x=>x.id===g).title}"`); },
  'a-done'(g){ S.A.done[g]=!S.A.done[g]; log(`${S.A.done[g]?'Đánh dấu đã hiểu':'Bỏ đánh dấu'}: "${S.A.groups.find(x=>x.id===g).title}"`); }
};
const CHG_A = {
  'a-move'(id, val){ snapA(); let from; S.A.groups.forEach(g=>{ if(g.notes.includes(id)) from=g; g.notes=g.notes.filter(x=>x!==id); });
    const to=S.A.groups.find(g=>g.id===val); to.notes.push(id); log(`Chuyển "${NOTES[id].text}" từ "${from.title}" sang "${to.title}"`); },
  'a-rename'(gid, val){ const g=S.A.groups.find(x=>x.id===gid); const v=val.trim()||g.title; if(v!==g.title){ snapA(); log(`Đổi tên nhóm "${g.title}" thành "${v}"`); g.title=v; } }
};

/* ---------- Option B: AI nhắc ôn, người chọn ---------- */
function bStatus(p){ const b=S.B; if(b.res[p]==='ok') return '<span class="chip ok">Đã hiểu</span>'; if(b.res[p]==='no') return '<span class="chip warn">Vẫn chưa hiểu</span>';
  if(b.dec[p]==='later') return '<span class="chip plain">Để tối nay</span>'; if(b.dec[p]==='skip') return '<span class="chip plain">Đã bỏ qua</span>'; return ''; }
function viewB(){
  const b = S.B;
  if(b.stage===1){
    return `<div class="card"><div class="between"><span class="label">Nhắc học · 19:30</span><span class="chip ai">AI gợi ý</span></div>
      <h2>Ngày mai học Cloud buổi 13</h2>
      <p>Có 2 điểm bạn đã đánh dấu chưa hiểu nên xem lại trước buổi học.</p>
      <div class="row"><button class="btn primary" data-act="b-open">Xem gợi ý</button>
        <button class="btn${b.remind==='later'?' on':''}" data-act="b-remind" data-arg="later">Nhắc lại lúc 21:00</button>
        <button class="btn${b.remind==='off'?' on':''}" data-act="b-remind" data-arg="off">Tắt nhắc cho môn này</button></div>
      ${b.remind==='later'?'<p class="toast">Sẽ nhắc lại lúc 21:00.</p>':b.remind==='off'?'<p class="toast">Đã tắt nhắc cho môn Cloud. Bạn vẫn xem được gợi ý bất cứ lúc nào.</p>':''}
    </div>`;
  }
  if(b.stage===3){
    const p = POINTS[b.rev];
    return `<div class="row"><button class="btn small" data-act="b-back">← Quay lại danh sách</button></div>
      <div class="card"><span class="label">Đang ôn · điểm ${p.n}</span><h2>${p.title}</h2>
        <span class="label">Ghi chú của bạn ở buổi 12</span><div>${p.notes.map(id=>noteRow(id)).join('')}</div>
        <span class="label">Slide liên quan</span>${p.slides.map(slideBox).join('')}
        <div class="row"><button class="btn primary" data-act="b-res" data-arg="ok">Đã hiểu</button><button class="btn" data-act="b-res" data-arg="no">Vẫn chưa hiểu</button></div>
      </div>`;
  }
  const done = Object.values(b.res).filter(x=>x==='ok').length;
  const sug = B_SUGGEST.filter(s=>!b.wrong[s.p]).map(s => { const p=POINTS[s.p]; return `<div class="card">
      <div class="between"><h3>${p.n} ${p.title}</h3>${s.level==='high'?'<span class="chip ai">Liên quan cao</span>':'<span class="chip warn">Có thể liên quan</span>'}</div>
      <p class="small"><span class="label">Vì sao AI gợi ý</span><br>${s.reason}</p>
      ${bStatus(s.p)}
      <div class="row"><button class="btn primary small" data-act="b-rev" data-arg="${s.p}">Ôn ngay</button>
        <button class="btn small${b.dec[s.p]==='later'?' on':''}" data-act="b-dec" data-arg="${s.p}:later">Để tối nay</button>
        <button class="btn small${b.dec[s.p]==='skip'?' on':''}" data-act="b-dec" data-arg="${s.p}:skip">Bỏ qua</button>
        <button class="btn link small" data-act="b-wrong" data-arg="${s.p}">Gợi ý này không đúng</button></div>
    </div>`; }).join('');
  const wrongNote = Object.keys(b.wrong).length ? `<p class="toast">Đã ghi nhận. AI sẽ không gợi ý ${Object.keys(b.wrong).map(p=>POINTS[p].n).join(', ')} nữa; điểm này vẫn còn trong danh sách đầy đủ.</p>` : '';
  const all = b.all ? `<div class="card"><h3>Tất cả điểm chưa hiểu (3)</h3><p class="small muted">Danh sách bạn đã đánh dấu, không qua AI.</p>
      ${Object.entries(POINTS).map(([k,p])=>`<div class="note"><span class="ntype">${p.n}</span><span class="t">${p.title}<br>${bStatus(k)}</span><button class="btn small" data-act="b-rev" data-arg="${k}">Ôn</button></div>`).join('')}</div>` : '';
  return `<div class="ai-box"><span class="ai-tag">AI gợi ý ôn trước buổi 13</span>
      <p>AI gợi ý dựa trên các điểm bạn đã đánh dấu và đề cương buổi 13. AI không biết bạn đã tự ôn ở nơi khác.</p>
      <p class="small"><span class="label">Đề cương buổi 13</span><br>${B_OUTLINE.map((x,i)=>`${i+1}. ${x}`).join('<br>')}</p></div>
    <div class="between"><h2>Nên xem lại</h2><span class="progress">${done}/3 đã hiểu</span></div>
    ${sug}${wrongNote}
    <div class="row"><button class="btn link" data-act="b-all">${b.all?'Ẩn danh sách đầy đủ':'Xem tất cả điểm chưa hiểu (3)'}</button></div>${all}`;
}
const ACT_B = {
  'b-open'(){ S.B.stage=2; log('Bấm "Xem gợi ý"'); },
  'b-remind'(v){ S.B.remind=v; log(v==='later'?'Chọn nhắc lại lúc 21:00':'Tắt nhắc cho môn này'); },
  'b-dec'(arg){ const [p,v]=arg.split(':'); S.B.dec[p]=v; log(`${v==='later'?'Để tối nay':'Bỏ qua'} điểm ${POINTS[p].n}`); },
  'b-rev'(p){ S.B.rev=p; S.B.stage=3; log(`Ôn điểm ${POINTS[p].n}${p==='p1'?' — điểm AI đã bỏ sót':''}`); },
  'b-back'(){ S.B.stage=2; log('Quay lại danh sách mà chưa đánh giá'); },
  'b-res'(v){ const p=S.B.rev; S.B.res[p]=v; S.B.stage=2; log(`${v==='ok'?'Đánh dấu đã hiểu':'Đánh dấu vẫn chưa hiểu'} điểm ${POINTS[p].n}`); },
  'b-wrong'(p){ S.B.wrong[p]=true; log(`Báo "Gợi ý này không đúng" cho điểm ${POINTS[p].n}`); },
  'b-all'(){ S.B.all=!S.B.all; if(S.B.all) log('Mở "Xem tất cả điểm chưa hiểu"'); }
};

/* ---------- Option C: Người tự đánh dấu, AI hỗ trợ khi hỏi ---------- */
const C_STATUS = {ok:['ok','Đã hiểu'], no:['warn','Vẫn chưa hiểu'], ask:['plain','Hỏi giảng viên']};
function cStatus(id){ const s=S.C.st[id]; return s ? `<span class="chip ${C_STATUS[s][0]}">${C_STATUS[s][1]}</span>` : '<span class="chip warn">Chưa hiểu</span>'; }
function viewC(){
  const c = S.C;
  if(!c.open){
    const done = c.items.filter(i=>c.st[i.id]==='ok').length;
    return `<div class="card"><div class="between"><h2>Điểm tôi chưa hiểu · buổi 12</h2><span class="progress">${done}/${c.items.length} đã hiểu</span></div>
      <p class="small muted">Danh sách bạn tự ghi cuối buổi học.</p>
      <div>${c.items.map(i=>`<div class="note"><span class="ntype">${i.p?POINTS[i.p].n:'+'}</span><span class="t">${esc(i.text)}<br>${cStatus(i.id)}</span><button class="btn small" data-act="c-open" data-arg="${i.id}">Mở</button></div>`).join('')}</div>
      <div class="row"><input type="text" id="c-new" placeholder="Thêm điểm chưa hiểu…" aria-label="Thêm điểm chưa hiểu"><button class="btn small" data-act="c-add">Thêm</button></div>
    </div>`;
  }
  const it = c.items.find(i=>i.id===c.open); const p = it.p ? POINTS[it.p] : null; const ans = it.p ? C_ANSWERS[it.p] : null;
  let aiPart = '';
  if(c.asked[it.id]){
    if(!ans){ aiPart = `<div class="ai-box"><span class="ai-tag">AI trả lời</span><p>Trong bản thử này, AI chỉ trả lời được các câu liên quan đến slide buổi 12.</p></div>`; }
    else {
      const body = c.alt[it.id] ? ans.alt : ans.text;
      aiPart = `<div class="ai-box"><span class="ai-tag">AI trả lời</span>
        <p class="small muted">AI chỉ giải thích dựa trên slide buổi 12 và có thể sai — hãy đối chiếu với slide được trích.</p>
        ${ans.grounded ? `<p><strong>${ans.cite}:</strong> ${body}</p>` : `<div class="warn-box">Slide buổi 12 không nói rõ điều này — đây là giải thích chung, độ tin cậy thấp hơn.</div><p>${body}</p>`}
        <div class="row"><button class="btn small" data-act="c-alt">${c.alt[it.id]?'Xem giải thích ban đầu':'Giải thích cách khác'}</button>
          <button class="btn small" data-act="c-flag">Câu trả lời chưa đúng / chưa rõ</button></div>
        ${c.flag[it.id] ? '<p class="toast">Đã ghi nhận. Bạn có thể mở slide gốc để đối chiếu hoặc đánh dấu "Hỏi giảng viên".</p>' : ''}
      </div>`;
    }
  }
  return `<div class="row"><button class="btn small" data-act="c-close">← Quay lại danh sách</button></div>
    <div class="card"><div class="between"><span class="label">Điểm chưa hiểu ${p?p.n:''}</span>${cStatus(it.id)}</div><h2>${esc(it.text)}</h2>
      ${p ? `<span class="label">Ghi chú của bạn ở buổi 12</span><div>${p.notes.map(id=>noteRow(id)).join('')}</div>` : ''}
      <div class="row">${c.asked[it.id] ? '' : '<button class="btn primary" data-act="c-ask">Hỏi AI</button>'}
        ${p ? `<button class="btn" data-act="c-slide">${c.slide[it.id]?'Ẩn slide gốc':'Mở slide gốc'}</button>` : ''}</div>
      ${c.slide[it.id] && p ? p.slides.map(slideBox).join('') : ''}
    </div>
    ${aiPart}
    <div class="card"><span class="label">Bạn tự đánh giá</span>
      <div class="row"><button class="btn${c.st[it.id]==='ok'?' on':''}" data-act="c-st" data-arg="ok">Đã hiểu</button>
        <button class="btn${c.st[it.id]==='no'?' on':''}" data-act="c-st" data-arg="no">Vẫn chưa hiểu</button>
        <button class="btn${c.st[it.id]==='ask'?' on':''}" data-act="c-st" data-arg="ask">Hỏi giảng viên</button></div></div>`;
}
const cItem = () => S.C.items.find(i=>i.id===S.C.open);
const cName = it => it.p ? `điểm ${POINTS[it.p].n}` : `"${it.text}"`;
const ACT_C = {
  'c-open'(id){ S.C.open=id; log(`Mở ${cName(S.C.items.find(i=>i.id===id))}`); },
  'c-close'(){ log(`Đóng ${cName(cItem())}`); S.C.open=null; },
  'c-ask'(){ const it=cItem(); S.C.asked[it.id]=true; log(`Hỏi AI về ${cName(it)}${it.p==='p3'?' — nhận câu trả lời ngoài slide (lỗi cài sẵn)':''}`); },
  'c-alt'(){ const it=cItem(); S.C.alt[it.id]=!S.C.alt[it.id]; log(`${S.C.alt[it.id]?'Xem giải thích cách khác':'Quay lại giải thích ban đầu'} — ${cName(it)}`); },
  'c-flag'(){ const it=cItem(); S.C.flag[it.id]=true; log(`Báo câu trả lời chưa đúng/chưa rõ — ${cName(it)}`); },
  'c-slide'(){ const it=cItem(); S.C.slide[it.id]=!S.C.slide[it.id]; if(S.C.slide[it.id]) log(`Mở slide gốc — ${cName(it)}${it.p==='p3'&&S.C.asked[it.id]?' (đối chiếu sau khi đọc câu trả lời ngoài slide)':''}`); },
  'c-st'(v){ const it=cItem(); S.C.st[it.id]=v; log(`Tự đánh giá ${cName(it)}: ${C_STATUS[v][1]}`); S.C.open=null; },
  'c-add'(){ const el=document.getElementById('c-new'); const v=(el&&el.value||'').trim(); if(!v) return; const id='i'+(S.C.nextId++); S.C.items.push({id, p:null, text:v}); log(`Thêm điểm mới: "${v}"`); }
};

/* ---------- Màn hình điều phối ---------- */
function viewStart(){
  return `<h1>Ôn lại điểm chưa hiểu</h1>
    <p class="muted">Bản thử nghiệm của nhóm NaCl · Case B — AI Notes. Ba bản cùng một nhiệm vụ, khác cách chia việc giữa người và AI.</p>
    <div class="card"><span class="label">Dành cho người điều phối</span>
      <label class="stack small" for="f-tester">Mã tester (không cần tên thật)
        <input type="text" id="f-tester" data-input="f-tester" value="${esc(S.tester)}" placeholder="Ví dụ: T1"></label>
      <div class="stack"><span class="small">Thứ tự thử (đổi giữa các tester)</span>
        <div class="radio-row">${Object.entries(ORDERS).map(([k,v])=>`<label><input type="radio" name="ord" id="ord-${k}" value="${k}" data-change="f-order"${S.order===k?' checked':''}> ${v.join(' → ')}</label>`).join('')}</div></div>
      <ul class="plain small">
        <li>Đọc nhiệm vụ cho tester, sau đó im lặng quan sát.</li>
        <li>Không giải thích cách dùng, không hỏi “Bạn có thích không?”.</li>
        <li>Nhật ký thao tác được ghi tự động, xem ở màn hình cuối.</li>
      </ul>
      <div class="row"><button class="btn primary" data-act="f-start">Bắt đầu phiên test</button></div>
    </div>
    <div class="card"><span class="label">Xem riêng từng bản</span>
      <div class="row"><a class="btn" href="#a">${OPT_NAME.A}</a><a class="btn" href="#b">${OPT_NAME.B}</a><a class="btn" href="#c">${OPT_NAME.C}</a></div></div>`;
}
function viewBetween(){
  return `${appbar()}<div class="card"><span class="label">Bản ${S.idx+1}/3</span><h2>Bản tiếp theo</h2>${taskBox()}
    <div class="row"><button class="btn primary" data-act="f-go">Bắt đầu</button></div></div>`;
}
function logText(){
  return `Tester: ${S.tester||'(chưa ghi)'} · Thứ tự: ${ORDERS[S.order].join(' → ')}\n` +
    S.log.map(l=>`[${l.opt}] ${String(l.t).padStart(4,' ')}s  ${l.ev}`).join('\n');
}
function viewEnd(){
  const rows = ['A','B','C'].map(o => { const ls=S.log.filter(l=>l.opt===o); return `<tr><td>${OPT_NAME[o]}</td><td class="num">${ls.length?ls[ls.length-1].t+'s':'–'}</td><td class="num">${Math.max(ls.length-2,0)}</td></tr>`; }).join('');
  return `<h1>Đã thử xong cả 3 bản</h1><p class="muted">Cảm ơn bạn đã tham gia. Phần dưới dành cho người điều phối.</p>
    <div class="card"><span class="label">Câu hỏi sau test (không dẫn dắt)</span><ul class="plain">
      <li>Ở mỗi bản, bạn đã làm gì? Chỗ nào bạn dừng lại?</li>
      <li>Nếu phải dùng thật, bạn chọn bản nào? Bạn chấp nhận mất điều gì khi chọn nó?</li>
      <li>Có lúc nào bạn không chắc nên tin AI không? Lúc đó bạn làm gì?</li></ul></div>
    <div class="card"><span class="label">Tóm tắt</span><div class="table-wrap"><table><thead><tr><th>Bản</th><th>Thời gian</th><th>Thao tác</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><div class="between"><span class="label">Nhật ký thao tác</span><button class="btn small" data-act="f-copy">${S.copied?'Đã sao chép':'Sao chép'}</button></div>
      <textarea class="log" id="log-text" readonly>${esc(logText())}</textarea>
      <p class="small muted">Nhật ký chỉ ghi thao tác. Lời tester nói và lý do họ chọn phải do người điều phối tự ghi.</p></div>
    <div class="row"><button class="btn" data-act="f-new">Phiên test mới</button></div>`;
}
const ACT_F = {
  'f-start'(){ S.idx=0; S.log=[]; S.screen='between'; },
  'f-go'(){ startOption(); },
  'f-done'(){ log('Tester báo đã xong'); if(S.single){ S.screen='start'; S.single=null; history.replaceState(null,'',location.pathname); return; }
    S.idx++; S.screen = S.idx<3 ? 'between' : 'end'; },
  'f-reset'(){ S.log=[]; startOption(); },
  'f-new'(){ S={...S, screen:'start', tester:'', idx:0, log:[], copied:false}; },
  'f-copy'(){ const txt=logText(); const ta=document.getElementById('log-text');
    try{ navigator.clipboard.writeText(txt).then(()=>{S.copied=true;render();}).catch(()=>{ ta.focus(); ta.select(); }); }catch(e){ ta.focus(); ta.select(); } }
};
const CHG_F = { 'f-order'(_, v){ S.order=v; } };

/* ---------- Render ---------- */
function render(){
  const app=document.getElementById('app'), bar=document.getElementById('facbar');
  let html='';
  if(S.screen==='start') html=viewStart();
  else if(S.screen==='between') html=viewBetween();
  else if(S.screen==='end') html=viewEnd();
  else { const o=cur(); html = appbar() + taskBox() + (o==='A'?viewA():o==='B'?viewB():viewC()); }
  app.innerHTML=html;
  if(S.screen==='opt'){
    bar.hidden=false;
    bar.innerHTML = S.single
      ? `<div class="in"><span class="small muted">Xem riêng ${OPT_NAME[S.single]}</span><div class="row"><button class="btn small" data-act="f-reset">Làm lại</button><button class="btn small" data-act="f-done">Về trang đầu</button></div></div>`
      : `<div class="in"><span class="small muted">Bản ${S.idx+1}/3</span><button class="btn primary" data-act="f-done">Tôi đã xong bản này →</button></div>`;
  } else bar.hidden=true;
}
const ACTS = {...ACT_A, ...ACT_B, ...ACT_C, ...ACT_F};
const CHGS = {...CHG_A, ...CHG_F};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = ACTS[el.dataset.act]; if(!fn) return;
  fn(el.dataset.arg); if(el.dataset.act!=='f-copy') render();
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if(!el) return;
  const fn = CHGS[el.dataset.change]; if(!fn) return;
  fn(el.dataset.arg, el.value); render();
});
document.addEventListener('input', e => { if(e.target.dataset.input==='f-tester') S.tester=e.target.value; });
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='c-new'){ ACTS['c-add'](); render(); } });
function route(){
  const h=location.hash.replace('#','').toUpperCase();
  if(['A','B','C'].includes(h)){ S.single=h; S.log=[]; startOption(); }
  else if(S.single){ S.single=null; S.screen='start'; }
  render();
}
window.addEventListener('hashchange', route);
route();
</script>
